// Use the separate demonstration profile with launch-sp.sh --jolt-demo.
set g_joltReactions 1
set g_joltReactionPose 1
set g_joltDebug 0
set timescale 1
set cg_thirdPerson 0
set con_notifytime -1
bind F5 "jolt_demo hit"
bind F6 "jolt_demo step"
bind F7 "jolt_demo leg"
bind F8 "jolt_demo run"
bind F9 "jolt_demo fall"
bind F10 "jolt_demo reset"
bind F11 "toggle timescale 1 0.25"
bind F12 "jolt_demo stop"
devmap t1_sour
wait 60
exitview
god
notarget
wait 30
jolt_demo all
