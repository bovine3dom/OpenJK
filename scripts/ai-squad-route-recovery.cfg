exec ai-squad-contact-setup.cfg
npc kill _memory_b
nav memory _memory_a fight
nav memory _memory_a cooldown
d_npcfreeze 0
set route_wait "nav memory _memory_a nearshot; wait 2; nav memory _memory_a blockroute"
set route_poll "vstr route_wait; vstr route_wait; vstr route_wait; vstr route_wait"
vstr route_poll
vstr route_poll
vstr route_poll
vstr route_poll
echo OJK_SQUAD_BLOCK_READY
nav memory _memory_a
echo OJK_SQUAD_BLOCKED
set route_sample "wait 5; nav memory _memory_a"
set route_block "vstr route_sample; vstr route_sample; vstr route_sample; vstr route_sample; vstr route_sample; vstr route_sample; vstr route_sample; vstr route_sample"
vstr route_block
vstr route_block
vstr route_block
nav memory _memory_a unblockroute
wait 80
echo OJK_SQUAD_RECOVERED
nav memory _memory_a
