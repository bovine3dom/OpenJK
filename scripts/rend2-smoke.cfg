// Use the AI-memory fixture for a live stormtrooper and a clear camera view.
set d_squadTactics 0
exec ai-memory.cfg
set cg_thirdPerson 1
set cg_draw2D 0
nav memory _memory_a protect
give weaponnum 1
weapon 1
wait 10
+attack
wait 10
-attack
setviewpos 2688 640 -60 315
wait 20
nav memory _memory_a
screenshot_png rend2_before
wait 2
echo OJK_REND2_BEFORE
save rend2_lifecycle
wait 4
vid_restart
wait 40
helpusobi 1
nav memory _memory_a
screenshot_png rend2_restart
wait 2
echo OJK_REND2_RESTART
load rend2_lifecycle
wait 40
helpusobi 1
nav memory _memory_a
screenshot_png rend2_loaded
wait 2
echo OJK_REND2_LOADED
devmap t1_sour
wait 100
exitview
wait 40
screenshot_png rend2_transition
wait 2
echo OJK_REND2_TRANSITION
