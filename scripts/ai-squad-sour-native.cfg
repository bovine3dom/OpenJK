// Use the original map spawners and let their spawn scripts finish.
set com_maxfps 20
set g_squadProactive 0
wait 20
exitview
wait 200
god
give weaponnum 3
give ammo
wait 5
weapon 3
vstr sour_position
vstr sour_spawn
wait 100
set d_npcai 4
nav actors
vstr sour_select
vstr nav_native_protect
wait 40
echo OJK_SOUR_BEFORE
vstr nav_native_sample
vstr sour_action
echo OJK_SOUR_HIT
set sour_sample "wait 2; vstr nav_native_sample"
set sour_block "vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample; vstr sour_sample"
vstr sour_block
vstr sour_block
vstr sour_block
vstr sour_block
// Allow an escape, a subsequent cover move, and the final hold to finish.
wait 300
echo OJK_SOUR_DONE
vstr nav_native_sample
nav actors
