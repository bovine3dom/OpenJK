exec ai-squad-setup.cfg
nav memory _memory_a enemy
d_npcfreeze 0
wait 100
nav memory _memory_a fight
nav memory _memory_b fight
wait 40
d_npcfreeze 1
// Attach a reservation if the flank uses a waypoint instead of a combat point.
nav memory _memory_b reserve
nav memory _memory_b queue
echo OJK_SQUAD_PREPARED
nav memory _memory_a
nav memory _memory_b
