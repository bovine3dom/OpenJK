exec ai-squad-cycle-setup.cfg
set squad_capture_loop "wait 1; vstr squad_capture_action; vstr squad_capture_loop"
vstr squad_capture_loop
echo OJK_SQUAD_SAVE
nav memory _memory_a
save cover_leg
wait 4
load cover_leg
wait 4
helpusobi 1
d_npcfreeze 1
echo OJK_SQUAD_RESTORED
nav memory _memory_a
d_npcfreeze 0
wait 100
echo OJK_SQUAD_RESUMED
nav memory _memory_a
