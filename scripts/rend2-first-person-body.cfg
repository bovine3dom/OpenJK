// First-person full-body view smoke profile.
// Run on a loaded map with real GameData.
set cg_thirdPerson 0
set cg_firstPersonBody 1
set cg_firstPersonBodyTest 0
set cg_draw2D 0
set cl_pitchspeed 1000
wait 10
screenshot_png first_person_body_forward
+lookdown
wait 30
-lookdown
wait 2
screenshot_png first_person_body_down
+kick
wait 5
screenshot_png first_person_body_kick
-kick
wait 2
