exec ai-memory.cfg
set d_noGroupAI 1
nav memory _memory_a dontflee
nav memory _memory_a protect
d_npcfreeze 1
setviewpos 2432 448 -60 270
wait 10
npc spawn rebel _memory_b
wait 10
nav memory _memory_b hold
nav memory _memory_b protect
nav memory _memory_b dontflee
setviewpos 2368 556 -60 0
wait 10
d_npcfreeze 0
wait 12
nav memory _memory_a chase
wait 4
d_npcfreeze 1
echo OJK_MEMORY_TRACK
nav memory _memory_a
// Reassign the same target before the AI can change its goal.
nav memory _memory_a enemy
echo OJK_MEMORY_SAME_TARGET
nav memory _memory_a
nav memory _memory_a enemy _memory_b
echo OJK_MEMORY_SWITCHED
nav memory _memory_a
nav memory _memory_b
d_npcfreeze 0
wait 12
echo OJK_MEMORY_SWITCH_HOLD
nav memory _memory_a
