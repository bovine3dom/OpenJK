set g_squadPressureOverrides 1
exec ai-squad-contact-setup.cfg
npc kill _memory_b
nav memory _memory_a cooldown
nav memory _memory_a shortshot
d_npcfreeze 0
wait 5
d_npcfreeze 1
wait 10
echo OJK_SQUAD_SAVE
nav memory _memory_a
save held_pressure
wait 4
load held_pressure
wait 4
helpusobi 1
d_npcfreeze 1
echo OJK_SQUAD_RESTORED
nav memory _memory_a
d_npcfreeze 0
wait 220
echo OJK_SQUAD_HELD_FINISHED
nav memory _memory_a
