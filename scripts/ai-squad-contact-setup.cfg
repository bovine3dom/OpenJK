// Keep B north of A, clear of the retreat route. Use normal health.
exec krildor-traverse.cfg
d_npcfreeze 1
setviewpos 2752 632 -60 270
wait 10
npc spawn stormtrooper _memory_a
wait 10
nav memory _memory_a hold
nav memory _memory_a protect
setviewpos 2772 764 -60 270
wait 10
npc spawn stormtrooper _memory_b
wait 10
nav memory _memory_b hold
nav memory _memory_b protect
setviewpos 2520 680 -60 315
wait 10
set d_npcai 4
nav memory _memory_a enemy
d_npcfreeze 0
wait 100
echo OJK_SQUAD_BASELINE
nav memory _memory_a
wait 10
echo OJK_SQUAD_PREHIT
nav memory _memory_a
d_npcfreeze 1
nav memory _memory_b fight
