exec ai-squad-contact-setup.cfg
nav memory _memory_a fight
echo OJK_SQUAD_PRESSURED_READY
nav memory _memory_a
nav memory _memory_b
nav memory _memory_a shortshot
d_npcfreeze 0
set pressure_sample "wait 5; nav memory _memory_a; nav memory _memory_b"
set pressure_block "vstr pressure_sample; vstr pressure_sample; vstr pressure_sample; vstr pressure_sample; vstr pressure_sample; vstr pressure_sample; vstr pressure_sample; vstr pressure_sample"
echo OJK_SQUAD_RESPONSE
vstr pressure_block
vstr pressure_block
vstr pressure_block
