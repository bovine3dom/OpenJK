exec ai-memory.cfg
// Freeze only while teleport positions and model poses settle.
d_npcfreeze 1
setviewpos 2368 556 -60 0
wait 10
d_npcfreeze 0
wait 200
echo OJK_MEMORY_HIDDEN_B
nav memory _memory_a
d_npcfreeze 1
setviewpos 2432 384 -60 0
wait 10
d_npcfreeze 0
wait 100
echo OJK_MEMORY_HIDDEN_C
nav memory _memory_a
nav memory _memory_a chase
wait 4
echo OJK_MEMORY_TRACK
nav memory _memory_a
nav memory _memory_a hold
d_npcfreeze 1
setviewpos 2668 404 -60 0
wait 10
d_npcfreeze 0
wait 30
echo OJK_MEMORY_REACQUIRED
nav memory _memory_a
