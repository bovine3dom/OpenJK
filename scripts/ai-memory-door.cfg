// A normal stormtrooper must approach and reopen a door to regain target contact.
exec krildor-traverse.cfg
d_npcfreeze 1
setviewpos 6336 702 -60 270
wait 10
npc spawn stormtrooper _memory_a
wait 10
nav memory _memory_a hold
nav memory _memory_a enemy
setviewpos 6150 638 -60 180
wait 30
setviewpos 5800 638 -60 180
wait 10
d_npcfreeze 0
wait 10
echo OJK_MEMORY_DOOR_VISIBLE
nav memory _memory_a
nav doors Hanger_door1
wait 220
echo OJK_MEMORY_DOOR_HIDDEN
nav memory _memory_a
nav doors Hanger_door1
set d_npcai 4
nav memory _memory_a chase
wait 120
echo OJK_MEMORY_DOOR_FOLLOW
nav memory _memory_a
nav doors Hanger_door1
