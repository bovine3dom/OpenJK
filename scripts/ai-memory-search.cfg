exec ai-memory.cfg
d_npcfreeze 1
setviewpos 2368 556 -60 0
wait 10
// Advance simulation time without waiting three wall-clock minutes.
fixedtime 200
com_maxfps 60
r_norefresh 1
wait 1900
r_norefresh 0
fixedtime 0
com_maxfps 10
echo OJK_MEMORY_EXPIRED
nav memory _memory_a
nav memory _memory_a chase
d_npcfreeze 0
wait 4
echo OJK_MEMORY_SEARCH
nav memory _memory_a
