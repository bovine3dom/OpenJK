exec krildor-traverse.cfg
d_npcfreeze 1
cg_draw2D 0
cg_drawGun 0
cg_thirdPerson 0
r_drawentities 0
r_autoExposure 0
r_forceAutoExposure 0
con_notifytime -1
setviewpos 2688 640 -60 315
wait 100
fixedtime 1
vstr compare_actor
r_generatedNormalStrength 0.375
r_ssaoStrength 0.8
exec rend2-compare.cfg
wait 30
screenshot_png compare_modern
wait 2
nav player
echo OJK_COMPARE_MODERN
vstr rend2_compare
wait 20
screenshot_png compare_base
wait 2
nav player
echo OJK_COMPARE_BASE
r_compareEnhancements 2
wait 20
screenshot_png compare_split
wait 2
nav player
echo OJK_COMPARE_SPLIT
vstr rend2_split
wait 20
screenshot_png compare_restored
wait 2
r_generatedNormalStrength
r_ssaoStrength
nav player
echo OJK_COMPARE_RESTORED
r_compareEnhancements 2
save render_compare
wait 4
load render_compare
wait 200
vstr compare_actor
wait 10
screenshot_png compare_loaded
wait 2
nav player
echo OJK_COMPARE_LOADED
vid_restart
wait 200
vstr compare_actor
wait 10
screenshot_png compare_restarted
wait 2
nav player
echo OJK_COMPARE_RESTARTED
r_compareEnhancements 0
