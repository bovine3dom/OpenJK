// Use one healthy, protected actor in the contact room.
set com_maxfps 20
exec ai-squad-contact-setup.cfg
npc kill _memory_b
nav memory _memory_a fight
echo OJK_SQUAD_READY
nav memory _memory_a
d_npcfreeze 0
set squad_cycle_sample "wait 10; nav memory _memory_a"
set squad_cycle_block "vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample; vstr squad_cycle_sample"
