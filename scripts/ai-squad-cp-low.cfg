// The former owner has the lower entity number. Keep both NPCs frozen.
exec ai-squad-setup.cfg
nav memory _memory_a cp 0
echo OJK_SQUAD_OWNED
nav memory _memory_a
nav memory _memory_b
nav memory _memory_a release
echo OJK_SQUAD_RELEASED
nav memory _memory_a
nav memory _memory_b
nav memory _memory_b cp 0
exec ai-squad-cp-save.cfg
nav memory _memory_a release
echo OJK_SQUAD_REUSED
nav memory _memory_a
nav memory _memory_b
nav memory _memory_a cp 1
nav memory _memory_a cp 0
echo OJK_SQUAD_FAILED
nav memory _memory_a
nav memory _memory_b
nav memory _memory_a cp 1
nav memory _memory_a vacate
echo OJK_SQUAD_VACATED
nav memory _memory_a
nav memory _memory_b
nav memory _memory_b release
echo OJK_SQUAD_CLEANED
nav memory _memory_a
nav memory _memory_b
