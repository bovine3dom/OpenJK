set g_squadPressureOverrides 1
exec ai-squad-contact-setup.cfg
npc kill _memory_b
nav memory _memory_a cooldown
vstr held_setup
echo OJK_SQUAD_HELD_READY
nav memory _memory_a
vstr held_action
echo OJK_SQUAD_HELD_HIT
nav memory _memory_a
d_npcfreeze 0
echo OJK_SQUAD_HELD_RESPONSE
set held_sample "wait 5; nav memory _memory_a"
set held_block "vstr held_sample; vstr held_sample; vstr held_sample; vstr held_sample; vstr held_sample; vstr held_sample; vstr held_sample; vstr held_sample"
vstr held_block
vstr held_block
vstr held_block
vstr held_block
wait 80
echo OJK_SQUAD_HELD_FINISHED
nav memory _memory_a
