wait 100
exitview
god
d_npcfreeze 1
// Zero can still show notifications from the current frame.
con_notifytime -1
cg_draw2D 0
cg_drawGun 0
cg_thirdPerson 0
cg_fov 80
r_drawentities 0
r_autoExposure 0
r_dynamicGlow 0
r_forceSun 0
r_drawSunRays 0
r_depthPrepass 1
r_ssaoAmbientOnly 1
r_ssaoDebug 0
setviewpos 2688 640 -60 315
wait 100
fixedtime 1
wait 20
r_ext_multisample
echo OJK_SSAO_BEGIN_AMBIENT
screenshot_png ssao_ambient
wait 2
echo OJK_SSAO_END_AMBIENT
r_ssaoAmbientOnly 0
wait 20
echo OJK_SSAO_BEGIN_BROAD
screenshot_png ssao_broad
wait 2
echo OJK_SSAO_END_BROAD
r_ssaoStrength 0
wait 20
echo OJK_SSAO_BEGIN_STRENGTH_ZERO
screenshot_png ssao_strength_zero
wait 2
echo OJK_SSAO_END_STRENGTH_ZERO
r_ssaoStrength 2
wait 20
echo OJK_SSAO_BEGIN_STRENGTH_HIGH
screenshot_png ssao_strength_high
wait 2
echo OJK_SSAO_END_STRENGTH_HIGH
r_ssaoStrength 1
r_ssaoRadius 0.5
r_ssaoDebug 2
wait 20
echo OJK_SSAO_BEGIN_RADIUS_SMALL
screenshot_png ssao_radius_small
wait 2
echo OJK_SSAO_END_RADIUS_SMALL
r_ssaoRadius 2
wait 20
echo OJK_SSAO_BEGIN_RADIUS_LARGE
screenshot_png ssao_radius_large
wait 2
echo OJK_SSAO_END_RADIUS_LARGE
r_ssaoRadius 1
r_ssaoDebug 1
wait 20
echo OJK_SSAO_BEGIN_RAW
screenshot_png ssao_raw
wait 2
echo OJK_SSAO_END_RAW
r_ssaoDebug 2
wait 20
echo OJK_SSAO_BEGIN_FILTERED
screenshot_png ssao_filtered
wait 2
echo OJK_SSAO_END_FILTERED
r_ssaoDebug 5
wait 20
echo OJK_SSAO_BEGIN_BENT_WORLD
screenshot_png ssao_bent_world
wait 2
echo OJK_SSAO_END_BENT_WORLD
r_ssaoDebug 0
r_ssaoAmbientOnly 1
wait 20
echo OJK_SSAO_BEGIN_RESTORED
screenshot_png ssao_restored
wait 2
echo OJK_SSAO_END_RESTORED
r_depthPrepass 0
r_ssaoDebug 2
wait 20
echo OJK_SSAO_BEGIN_PREPASS
screenshot_png ssao_prepass
wait 2
echo OJK_SSAO_END_PREPASS
r_ssaoDebug 0
wait 20
echo OJK_SSAO_BEGIN_PREPASS_SCENE
screenshot_png ssao_prepass_scene
wait 2
echo OJK_SSAO_END_PREPASS_SCENE
r_depthPrepass 1
r_ssaoDebug 0
r_ssaoAmbientOnly 1
wait 20
echo OJK_SSAO_DONE
// Check that shutdown drains a screenshot before it destroys the framebuffers.
screenshot_png ssao_before_restart
vid_restart
wait 40
screenshot_png smoke
quit
